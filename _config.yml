# GitHub Pages site (cim-compare.ucaiug.io), built from README.md.
# Primer is the theme GitHub Pages uses when none is named; it is named here
# so that assets/css/style.scss can build on it.
theme: jekyll-theme-primer
title: cim-compare
description: Command-line tool for generating CIM model comparison reports.
url: https://cim-compare.ucaiug.io
defaults:
  # Link-preview (Open Graph / X card) image for every page, emitted by {% seo %}
  # in the layout. jekyll-seo-tag only reads a page-level image, so it is set
  # here as a front-matter default. The same PNG is the repo's Social preview.
  - scope:
      path: ""
    values:
      image:
        path: /media/logo/cim-compare-social-1280x640.png
        width: 1280
        height: 640
        alt: "cim-compare: Command-line tool for generating CIM model comparison reports"
  # Primer prints the site title above a page whose title differs from it.
  # README.md's first heading is the logo (HTML), which Pages does not read as
  # a title, so give the page its title here.
  - scope:
      path: "README.md"
    values:
      title: cim-compare

# Latest release, shown in the website header (label and Download button).
# Update this on each release; the jar is downloaded from that GitHub release.
cim_compare_version: 2.3.0
